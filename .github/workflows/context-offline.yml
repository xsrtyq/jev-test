name: Context curator offline verification
on:
  push:
    paths: ['curator/**', 'tests/test_curator_v2.py', '.github/workflows/context-*.yml']
  pull_request:
    paths: ['curator/**', 'tests/test_curator_v2.py', '.github/workflows/context-*.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Unit tests without model credentials
        run: python3 -m unittest discover -s tests -v
      - name: Full CLI offline smoke
        run: |
          python3 -m curator plan --out offline-plan.json
          python3 -m curator run --out offline-context --frozen-plan offline-plan.json
          python3 -m curator run --suite replay --steps 10 --out offline-replay
          python3 -m curator run --suite retrieval --out offline-retrieval
          python3 -m curator run --suite retrieval_hard --out offline-retrieval-hard
          python3 -m curator cache --out offline-cache.json
          python3 -m curator scan offline-context
          python3 -c "import json; s=json.load(open('offline-context/summary.json')); assert s['model_requests']==0; assert s['execution']=='offline_no_model_results'"
