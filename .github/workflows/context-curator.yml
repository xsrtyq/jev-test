name: Jev context curator
on:
  workflow_dispatch:
    inputs:
      confirm_paid:
        description: Authorize paid Jev requests (unchecked = offline dry-run)
        required: true
        type: boolean
        default: false
      suite:
        description: Experiment suite (start with quick)
        required: true
        type: choice
        options: [quick, quality, robustness, retrieval, retrieval_hard, scaling, fanout, replay]
        default: quick
      split:
        description: Dataset split (do not tune prompts on test)
        required: true
        type: choice
        options: [dev, calibration, test]
        default: dev
      steps:
        description: Replay environment steps (not request count)
        required: true
        type: choice
        options: ['10', '20', '50']
        default: '20'
      question_language:
        description: Fixed question language; state is never translated here
        required: true
        type: choice
        options: [auto, zh, en]
        default: auto
permissions:
  contents: read
concurrency:
  group: jev-context-curator-${{ github.repository }}
  cancel-in-progress: false
jobs:
  experiment:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify offline before any model call
        run: |
          python3 -c "import sys; assert sys.version_info >= (3, 11)"
          python3 -m unittest discover -s tests -v
      - name: Freeze inputs and request budget
        env:
          SUITE: ${{ inputs.suite }}
          SPLIT: ${{ inputs.split }}
          STEPS: ${{ inputs.steps }}
        run: python3 -m curator plan --suite "$SUITE" --split "$SPLIT" --steps "$STEPS" --out context-plan.json
      - name: Run bounded experiment
        env:
          TYPESAFE_API_KEY: ${{ inputs.confirm_paid && secrets.TYPESAFE_API_KEY || '' }}
          LIVE: ${{ inputs.confirm_paid }}
          QUESTION_LANGUAGE: ${{ inputs.question_language }}
        run: |
          args=(--out context-run --frozen-plan context-plan.json --question-language "$QUESTION_LANGUAGE")
          if [ "$LIVE" = "true" ]; then args+=(--allow-paid); fi
          python3 -m curator run "${args[@]}"
      - name: Check artifacts for secrets
        id: scan
        if: always()
        env:
          TYPESAFE_API_KEY: ${{ inputs.confirm_paid && secrets.TYPESAFE_API_KEY || '' }}
        run: |
          if [ ! -d context-run ]; then echo 'safe=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 -m curator scan context-run
          echo 'safe=true' >> "$GITHUB_OUTPUT"
      - name: Publish summary
        if: always() && steps.scan.outputs.safe == 'true'
        run: |
          if [ -f context-run/report.md ]; then cat context-run/report.md >> "$GITHUB_STEP_SUMMARY"; fi
          echo 'Evidence retention is not downstream LLM task success. Read the limitations and missing evidence.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save reproducible results
        if: always() && steps.scan.outputs.safe == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jev-context-${{ inputs.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: context-run/
          retention-days: 14
          if-no-files-found: error
